[package]
name = "sni-router"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "net", "io-util"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
eyre = "0.6.12"
derive_more = { version = "2.0.1", features = ["from", "try_from", "debug", "display"] }
num_enum = "0.7.5"
winnow = "0.7.13"
serde = { version = "1.0.228", features = ["derive"] }
secrecy = { version = "0.10.3", features = ["serde"] }
toml = "0.9.8"
async-trait = "0.1.89"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
httparse = "1.10.1"
smart-default = "0.7.1"
parking_lot = "0.12.5"
tinyvec = "1.10.0"
shellexpand = "3.1.1"

[target.'cfg(target_os = "linux")'.dependencies]
realm_io = "0.5.3"
